version: 0.2

# Runs the NanoVDB CUDA / multi-GPU unit tests on AWS CodeBuild (4x A10G).
# This spec does NOT build the project. Instead it downloads the prebuilt
# build tree produced by the matching GitHub Actions run (see the
# linux-nanovdb / linux-nanovdb-gpu jobs in .github/workflows/nanovdb.yml),
# restores it at its original absolute path, and executes the GPU and Python tests.
#
# Required environment variables (provided by aws-codebuild-run-build):
#   ARTIFACT_NAME     - name of the GitHub Actions artifact to fetch
#   GH_TOKEN          - ephemeral GITHUB_TOKEN with actions:read
#   GITHUB_REPOSITORY - owner/repo (auto-forwarded GITHUB_* variable)
#   GITHUB_RUN_ID     - workflow run that produced the artifact (auto-forwarded)
#   ACTIONS_RUNTIME_TOKEN - job-scoped token used to upload the report
#   ACTIONS_RESULTS_URL   - GitHub Actions artifact service endpoint

env:
  variables:
    CUDA_HOME: /usr/local/cuda-12
    DIAGNOSTIC_GIST_ID: c082e01bf80cd88d045e1e61bd78d43c
    DIAGNOSTIC_GIST_REVISION: dcd46d4e3a65c5d36e1cde96ade0c102464d8a45

phases:
  install:
    commands:
      # Rocky Linux 8 image: tools required to fetch and unpack artifacts and
      # clone the multi-GPU diagnostic gist.
      - dnf install -y jq unzip tree 'dnf-command(config-manager)'
      - dnf config-manager --add-repo https://cli.github.com/packages/rpm/gh-cli.repo
      - dnf install -y gh
      - dnf module reset -y nodejs
      - dnf module enable -y nodejs:20
      - dnf install -y nodejs
      - npm install --prefix /tmp/actions-artifact-uploader --omit=dev --no-audit --no-fund @actions/artifact@6.2.2

  pre_build:
    commands:
      # Confirm the GPUs are visible (expect 4x A10G).
      - nvidia-smi
      - nvidia-smi topo -m
      # Locate, download and restore the prebuilt build tree.
      - 'echo "Fetching artifact ${ARTIFACT_NAME} from run ${GITHUB_RUN_ID}"'
      - |
        set -euo pipefail
        api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
        artifacts_json=$(curl -fsSL \
          -H "Authorization: Bearer ${GH_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "${api}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100")
        count=$(echo "${artifacts_json}" | jq --arg n "${ARTIFACT_NAME}" \
          '[.artifacts[] | select(.name==$n)] | length')
        if [ "${count}" != "1" ]; then
          echo "ERROR: expected exactly 1 artifact named '${ARTIFACT_NAME}', found ${count}"
          exit 1
        fi
        artifact_id=$(echo "${artifacts_json}" | jq -r --arg n "${ARTIFACT_NAME}" \
          '.artifacts[] | select(.name==$n) | .id')
        echo "Resolved artifact id ${artifact_id}"
        # The API returns a short-lived (60s) redirect to blob storage. Resolve
        # the redirect first, then download without the Authorization header so
        # it is not forwarded to the storage host.
        download_url=$(curl -sS -o /dev/null -w '%{redirect_url}' \
          -H "Authorization: Bearer ${GH_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          "${api}/actions/artifacts/${artifact_id}/zip")
        curl -fsSL -o /tmp/nanovdb-gpu-build.zip "${download_url}"
      - rm -rf /tmp/nanovdb-gpu-artifact
      - mkdir -p /tmp/nanovdb-gpu-artifact
      - unzip -q /tmp/nanovdb-gpu-build.zip -d /tmp/nanovdb-gpu-artifact
      - |
        set -euo pipefail
        set -a
        . /tmp/nanovdb-gpu-artifact/nanovdb-gpu-meta.env
        set +a
        echo "Restoring build tree and Python tests to ${BUILD_WORKSPACE}"
        mkdir -p "${BUILD_WORKSPACE}"
        rm -rf "${BUILD_WORKSPACE}/build"
        mv /tmp/nanovdb-gpu-artifact/build "${BUILD_WORKSPACE}/build"
        python_test_dir="${BUILD_WORKSPACE}/nanovdb/nanovdb/python/test"
        mkdir -p "${python_test_dir}"
        mv /tmp/nanovdb-gpu-artifact/nanovdb/nanovdb/python/test/TestNanoVDB.py \
          "${python_test_dir}/TestNanoVDB.py"

  build:
    commands:
      - |
        set -euo pipefail
        set -a
        . /tmp/nanovdb-gpu-artifact/nanovdb-gpu-meta.env
        set +a
        export PATH="${CUDA_HOME}/bin:${PATH}"
        export LD_LIBRARY_PATH="${CUDA_HOME}/lib64:${BUILD_WORKSPACE}/build/openvdb/openvdb:${BUILD_WORKSPACE}/build/nanovdb/nanovdb:${LD_LIBRARY_PATH:-}"
        cd "${BUILD_WORKSPACE}/build"
        ctest -V -R ".*cuda.*|.*mgpu.*|pytest_nanovdb" --output-on-failure

  post_build:
    commands:
      - |
        set -euo pipefail
        diagnostic_dir="${CODEBUILD_SRC_DIR}/${DIAGNOSTIC_GIST_ID}"
        rm -rf "${diagnostic_dir}" "${CODEBUILD_SRC_DIR}/report.tgz"
        cd "${CODEBUILD_SRC_DIR}"
        gh gist clone "${DIAGNOSTIC_GIST_ID}"
        # Pin the executable diagnostic code rather than trusting the mutable
        # head of the public gist on every CI run.
        git -C "${diagnostic_dir}" checkout --detach "${DIAGNOSTIC_GIST_REVISION}"

        diagnostic_status=0
        (
          cd "${diagnostic_dir}"
          bash ./run_on_runner.sh
        ) || diagnostic_status=$?

        if [ -d "${diagnostic_dir}/report" ]; then
          tar czf "${CODEBUILD_SRC_DIR}/report.tgz" \
            -C "${diagnostic_dir}" report/
        else
          echo "ERROR: the diagnostic did not produce report/"
          exit 1
        fi

        # Upload directly into the current GitHub Actions job. These values are
        # short-lived and scoped to this job's artifact service.
        : "${ACTIONS_RUNTIME_TOKEN:?ACTIONS_RUNTIME_TOKEN was not forwarded}"
        : "${ACTIONS_RESULTS_URL:?ACTIONS_RESULTS_URL was not forwarded}"
        cat > /tmp/actions-artifact-uploader/upload.mjs <<'EOF'
        import {DefaultArtifactClient} from '@actions/artifact'

        const reportPath = `${process.env.CODEBUILD_SRC_DIR}/report.tgz`
        const artifactName = process.env.ARTIFACT_NAME.replace(
          /^nanovdb-gpu-build-/,
          'nanovdb-gpu-report-'
        )
        const client = new DefaultArtifactClient()
        const result = await client.uploadArtifact(
          artifactName,
          [reportPath],
          process.env.CODEBUILD_SRC_DIR,
          {
            retentionDays: 7,
            compressionLevel: 0
          }
        )
        console.log(
          `Uploaded ${artifactName}: id=${result.id}, size=${result.size}, digest=${result.digest}`
        )
        EOF
        node /tmp/actions-artifact-uploader/upload.mjs
        exit "${diagnostic_status}"

name: GPU

# DISABLED: GPU testing has moved to the linux-nanovdb / linux-nanovdb-gpu
# jobs in .github/workflows/nanovdb.yml, which drive AWS CodeBuild via the
# repurposed buildspec.yml (it now downloads prebuilt artifacts rather than
# building from source). This workflow no longer runs automatically; it is
# kept for reference and can only be started manually.
on:
    workflow_dispatch: {}
jobs:
  # ---------------------------------------------------------------------------
  # Linux GPU (AWS CodeBuild)
  # ---------------------------------------------------------------------------

  linux_gpu:
    name: 'VDB GPU Tester'
    # Don't run on OCIO forks
    if: github.repository == 'AcademySoftwareFoundation/openvdb'
    # GH-hosted VM. The build runs in CentOS 7 'container' hard-coded in
    # AWS CodeBuild project.
    # TODO: Add support for dynamic GH Action defined CodeBuild
    #       container choice.
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.CODEBUILD_ID }}
          aws-secret-access-key: ${{ secrets.CODEBUILD_SECRET }}
          aws-region: us-west-2
      - name: Validate AWS Credentials
        run: |
            aws sts get-caller-identity
      - name: Run CodeBuild
        uses: aws-actions/aws-codebuild-run-build@v1
        with:
          project-name: OpenVDB
          buildspec-override: buildspec.yml
          image-override: aswf/ci-openvdb:2026

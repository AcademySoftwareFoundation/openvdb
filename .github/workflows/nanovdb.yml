
name: NanoVDB

on:
  push:
    branches:
      - 'master'
      - 'feature/**'
      - 'pr/**'
    paths-ignore:
      - 'CHANGES'
      - 'CODEOWNERS'
      - 'doc/**'
      - 'openvdb_ax/**'
      - 'openvdb_maya/**'
      - 'openvdb_houdini/**'
      - 'fvdb/**'
      - 'pendingchanges/**'
      - '**.md'
  pull_request:
    # Add 'ready_for_review' to run CI when a draft PR is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - '**'
    paths-ignore:
      - 'CHANGES'
      - 'CODEOWNERS'
      - 'doc/**'
      - 'openvdb_ax/**'
      - 'openvdb_maya/**'
      - 'openvdb_houdini/**'
      - 'fvdb/**'
      - 'pendingchanges/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      type:
        description: 'The type of CI to run (all, linux, win, mac)'
        required: true
        default: 'all'

# Allow subsequent pushes to the same PR or REF to cancel any previous jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-nanovdb:
    # push OR non-draft PR OR matching manual run
    if: |
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
       (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.type == 'all' || github.event.inputs.type == 'linux')))
    runs-on: ${{ (github.repository_owner == 'AcademySoftwareFoundation' && 'ubuntu-22.04-8c-32g-300h') || 'ubuntu-latest' }}
    name: >
      linux-nanovdb:cxx:${{ matrix.config.cxx }}-${{ matrix.config.build }}
    container:
      image: aswf/ci-openvdb:${{ matrix.config.image }}
    env:
      CXX: ${{ matrix.config.cxx }}
    strategy:
      matrix:
        config:
          - { cxx: g++,     image: '2024-clang17.2', build: 'Release' }
          - { cxx: g++,     image: '2024-clang17.2', build: 'Debug' }
          - { cxx: clang++, image: '2024-clang17.2', build: 'Release' }
          - { cxx: clang++, image: '2024-clang17.2', build: 'Debug' }
      fail-fast: false
    steps:
      - uses: actions/checkout@v3
      - name: setup_cuda_12
        run: |
          echo "/usr/local/cuda-12/bin" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=/usr/local/cuda-12/lib64:$LD_LIBRARY_PATH" >> $GITHUB_ENV
      - name: nanobind
        run: ./ci/install_nanobind.sh 2.5.0
      - name: build
      # NOTE: CMAKE_POSITION_INDEPENDENT_CODE set to fix default behaviour change in clang 14
      #   https://github.com/AcademySoftwareFoundation/aswf-docker/issues/228
        run: >
          ./ci/build.sh -v
          --build-type=${{ matrix.config.build }}
          --components=core,nano,nanotest,nanoexam,nanobench,nanotool,nanopython,nanopytest
          --cargs=\'
          -DUSE_EXPLICIT_INSTANTIATION=OFF
          -DNANOVDB_USE_CUDA=ON
          -DCMAKE_CUDA_ARCHITECTURES="80"
          -DNANOVDB_USE_OPENVDB=ON
          -DCMAKE_INSTALL_PREFIX=`pwd`
          -DUSE_BLOSC=ON
          -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          \'
      - name: test
        run: cd build && sudo ctest -V -E ".*cuda.*|.*mgpu.*"

  windows-nanovdb:
    if: |
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
       (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.type == 'all' || github.event.inputs.type == 'win')))
    runs-on: ${{ (github.repository_owner == 'AcademySoftwareFoundation' && 'windows-2022-8c-32g-300h') || 'windows-latest' }}
    env:
      VCPKG_DEFAULT_TRIPLET: 'x64-windows'
      # Cache built vcpkg packages in the GitHub Actions cache to avoid
      # rebuilding every dependency from source on every run.
      VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'
      visual_studio: "Visual Studio 17 2022"
      cuda: "12.4.0"
    strategy:
      fail-fast: false
    steps:
    - uses: actions/checkout@v3
    - name: path
      run: |
        # note: system path must be modified in a previous step to it's use
        echo "$Env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        echo "${{github.workspace}}\build\openvdb\openvdb\Release" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    # Expose the Actions cache endpoint/token to vcpkg for its x-gha
    # binary caching backend (they are only available to javascript actions).
    - name: export_gha_cache_env
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
    # Cache the CUDA toolkit install to skip the (slow) NVIDIA network
    # installer on cache hits.
    - name: cache_cuda
      id: cache-cuda
      uses: actions/cache@v4
      with:
        path: C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA
        key: ${{ runner.os }}-cuda-${{ env.cuda }}-${{ hashFiles('ci/install_windows_cuda.ps1') }}
    - name: install_cuda
      if: steps.cache-cuda.outputs.cache-hit != 'true'
      shell: powershell
      run: .\ci\install_windows_cuda.ps1
    # On a cache hit the installer didn't run, so recreate what it would
    # have done outside of the toolkit directory: the environment variables
    # and the Visual Studio CUDA build customizations.
    - name: restore_cuda_env
      if: steps.cache-cuda.outputs.cache-hit == 'true'
      shell: powershell
      run: |
        $ver = $env:cuda -replace '^([0-9]+)\.([0-9]+).*$','$1.$2'
        $cudaPath = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v$ver"
        echo "CUDA_PATH=$cudaPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "CUDA_PATH_V$($ver -replace '\.','_')=$cudaPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "$cudaPath\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
        Copy-Item "$cudaPath\extras\visual_studio_integration\MSBuildExtensions\*" "$vsPath\MSBuild\Microsoft\VC\v170\BuildCustomizations" -Force
    # Only install the dependencies this job's components actually need
    # (e.g. no openexr, cppunit, glfw3, glew, jemalloc or libpng).
    - name: install
      shell: powershell
      run: .\ci\install_windows.ps1 -Packages zlib,blosc,tbb,gtest,boost-iostreams,boost-interprocess,boost-algorithm,python3,nanobind
    - name: install_numpy
      shell: powershell
      run: .\ci\install_windows_numpy.ps1
    - name: build
    # nvcc doesn't set _WIN32 when run in bash so we need to set it manually
      shell: bash
      run: >
        ./ci/build.sh -v
        --config=Release
        --components=core,nano,nanotest,nanoexam,nanobench,nanotool,nanopython,nanopytest
        --cargs=\'
        -A x64 -G \"Visual Studio 17 2022\" -DOPENVDB_CORE_STATIC=OFF
        -DMSVC_COMPRESS_PDB=ON
        -DUSE_EXPLICIT_INSTANTIATION=OFF
        -DNANOVDB_USE_CUDA=ON
        -DCMAKE_CUDA_ARCHITECTURES="80"
        -DCMAKE_CUDA_FLAGS="-D_WIN32"
        -DNANOVDB_USE_OPENVDB=ON
        -DVCPKG_TARGET_TRIPLET=${VCPKG_DEFAULT_TRIPLET}
        -DCMAKE_TOOLCHAIN_FILE=\"${VCPKG_INSTALLATION_ROOT}\\scripts\\buildsystems\\vcpkg.cmake\"
        \'
    - name: test
      shell: bash
      run: cd build && ctest -V -C Release -E ".*cuda.*|.*mgpu.*"

  macos-nanovdb:
    if: |
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
       (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.type == 'all' || github.event.inputs.type == 'mac')))
    runs-on: ${{ matrix.config.runner }}
    env:
      CXX: ${{ matrix.config.cxx }}
    strategy:
      matrix:
        config:
          - { runner: 'macos-14', cxx: 'clang++', build: 'Release' }
          - { runner: 'macos-14', cxx: 'clang++', build: 'Debug'   }
      fail-fast: false
    steps:
      - uses: actions/checkout@v3
      - name: install_deps
        run: |
          ./ci/install_macos.sh
          ./ci/install_tbb_macos.sh
      - name: build
        run: >
          ./ci/build.sh -v
          --build-type=${{ matrix.config.build }}
          --components=core,nano,nanotest,nanoexam,nanobench,nanotool,nanopython,nanopytest
          --cargs=\'-DUSE_EXPLICIT_INSTANTIATION=OFF -DNANOVDB_USE_CUDA=OFF -DNANOVDB_USE_OPENVDB=ON -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install \'
      - name: test
        run: cd build && ctest -V -E ".*cuda.*|.*mgpu.*"

  nanovdb-lite:
    if: |
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
       (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.type == 'all' || github.event.inputs.type == 'linux')))
    runs-on: ${{ (github.repository_owner == 'AcademySoftwareFoundation' && 'ubuntu-22.04-8c-32g-300h') || 'ubuntu-latest' }}
    container:
      image: aswf/ci-openvdb:2024-clang17.2
    steps:
      - uses: actions/checkout@v3
      - name: install_gtest
        run: ./ci/install_gtest.sh latest
      - name: build_and_test
        run: |
          cd nanovdb/nanovdb
          sudo mkdir .build
          cd .build
          sudo cmake -DUSE_EXPLICIT_INSTANTIATION=OFF -DNANOVDB_BUILD_UNITTESTS=ON -DNANOVDB_USE_OPENVDB=OFF -DNANOVDB_USE_CUDA=OFF ../
          sudo make -j8 install
          sudo ctest -V
